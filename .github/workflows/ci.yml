name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --omit=dev skips mongodb-memory-server, whose install script downloads a
      # full MongoDB binary. The harness below is pure logic and needs neither a
      # database nor any dev dependency.
      - name: Install backend dependencies
        run: npm ci --omit=dev --prefix backend

      - name: Verify walkthrough layout (backend)
        run: npm run check

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Scene, palette and score-report harnesses. These are the regression
      # guards described in the README: a procedural 3D scene, the no-green /
      # no-red palette rule, and the single-page A4 score report.
      # Seven harnesses: procedural 3D scene, the no-green/no-red palette rule,
      # the single-page A4 score report, hazard counting, the responsive layout,
      # the dashboard band and the alert boxes (the last three assert against the
      # compiled CSS, so the build runs first).
      - name: Verify scene, palette, report, hazards, layout, banner and alerts (frontend)
        run: npm run verify --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend